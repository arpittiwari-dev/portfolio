[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  # SANITY_API_TOKEN must be set in Netlify dashboard → Site Settings → Environment Variables
  # It is intentionally NOT committed here. Required for image uploads to work in production.

# Increase body size limit for the upload API route (default is 1MB, images can be larger)
[functions]
  node_bundler = "nft"

[[functions]]
  path = "/api/upload"
  [functions.config]
    max_body_size = 10485760  # 10 MB in bytes

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-XSS-Protection = "1; mode=block"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://api.fontshare.com; font-src 'self' https://api.fontshare.com; img-src 'self' data: blob: https://cdn.sanity.io https://*.sanity.io; connect-src 'self' https://*.sanity.io https://api.emailjs.com;"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
